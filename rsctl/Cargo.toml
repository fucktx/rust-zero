[workspace]
resolver = "2"
members = [
  "cli",
  "core",
  "utils",
  "spec",
  "parse",
  "semantic",
  "gen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/fucktx/rust-zero"
description = "rsctl：描述文件 -> 解析 -> 语义归一 -> Spec(IR) -> 代码生成 -> 写盘 的代码生成器工作区"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
pest = "2.8"
pest_derive = "2.8"