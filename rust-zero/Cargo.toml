[package]
name = "rust-zero"
version = "0.1.0"
edition = "2024"
description = "rust-zero（合并 core + rest 的单一 crate）"
license = "Apache-2.0"
repository = "https://github.com/fucktx/rust-zero"
readme = "../README.md"

[features]
default = []
axum = ["dep:axum", "dep:tokio", "dep:hyper"]
actix = ["dep:actix-web", "dep:actix-service", "dep:actix-http"]
jwt = ["dep:jsonwebtoken"]

[dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "0.2"
matchit = "0.7"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tower-http = { version = "0.4", features = ["cors"] }
tower-layer = "0.3"
tower-service = "0.3"

jsonwebtoken = { version = "9", optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
axum = { version = "0.6", optional = true }
hyper = { version = "0.14", optional = true }
actix-web = { version = "4", optional = true }
actix-service = { version = "2", optional = true }
actix-http = { version = "3", optional = true }


