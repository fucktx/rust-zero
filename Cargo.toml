[package]
name = "zero"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "zero 门面 crate：对外统一入口（zero::core / zero::rest）"

[features]
default = []
axum = ["rest/axum"]
actix = ["rest/actix"]
jwt = ["rest/jwt"]

[dependencies]
core = { path = "core" }
rest = { path = "rest", default-features = false }

[workspace]
resolver = "2"
members = [
  "core",
  "rest",
  "rsctl",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/fucktx/rust-zero"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
pest = "2.8"
pest_derive = "2.8"


